# 日志配置已迁移至 src/task/app_init.rs 中的 init_logging()，
# 通过 RequestIdEncoder 自动注入 [x-request-id=...] 前缀。
# 此文件保留作格式参考。
refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%+)(utc)} [x-request-id=-] [{f}:{L}] {h({l})} {M}:{m}{n}"
  requests:
    kind: file
    path: "log/requests.log"
    encoder:
      pattern: "{d} - {m}{n}"
  render_file_logger:
    kind: file
    path: "log/my.log"
    encoder:
      pattern: "{d(%+)(utc)} [x-request-id=-] [{f}:{L}] {h({l})} {M}:{m}{n}"
root:
  level: info
  appenders:
    - stdout
    - render_file_logger
loggers:
  app::backend::db:
    level: info
  app::requests:
    level: info
    appenders:
      - requests
    additive: false
